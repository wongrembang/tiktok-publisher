<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<script>
  // Forward the OAuth callback (code, state, etc.) to Composio unchanged.
  (function () {
    var target = "https://backend.composio.dev/api/v3/toolkits/auth/callback";
    window.location.replace(target + window.location.search + window.location.hash);
  })();
</script>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#444;background:#fff}
</style>
</head>
<body>
<p>Connecting your account… If nothing happens, <a id="go" href="#">click here</a>.</p>
<script>
  document.getElementById("go").href =
    "https://backend.composio.dev/api/v3/toolkits/auth/callback" + window.location.search;
</script>
</body>
</html>
